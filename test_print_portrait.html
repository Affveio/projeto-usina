<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Teste Impressão Retrato A4</title>
<style>
    @page { size: A4 portrait; margin: 5mm; }
    html, body {
        margin: 0;
        padding: 0;
        background: #fff;
    }
    body {
        width: 210mm;
        min-height: 297mm;
        margin: 0 auto;
        padding: 0;
    }
    .page {
        width: 210mm;
        min-height: 297mm;
        box-sizing: border-box;
        padding: 5mm;
        border: 1px solid #000;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }
    h1 { font-size: 18px; margin: 0; }
    p { margin: 4px 0; font-size: 12px; }
</style>
</head>
<body>
    <div class="page">
        <div>
            <h1>Teste de Impressão</h1>
            <p>Orientação: retrato</p>
            <p>Dimensões A4: 210mm x 297mm</p>
            <p>Se este documento imprimir em paisagem, o navegador/driver não está respeitando CSS.</p>
        </div>
        <div style="font-size: 10px;">Abra o diálogo de impressão e verifique se o layout está como RETRATO.</div>
    </div>
</body>
</html>
